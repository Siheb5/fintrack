# application.yml — default (local development) configuration.
#
# By default we run against H2, an in-memory database, so you can start the
# backend with zero setup. To use the real PostgreSQL database instead, start
# the app with the "postgres" profile (see application-postgres.yml).

spring:
  application:
    name: fintrack-backend

  # ---- Database (H2 in-memory for local dev) ----
  datasource:
    url: jdbc:h2:mem:fintrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # H2 runs in "PostgreSQL mode" above so the same SQL works in both.
  jpa:
    hibernate:
      ddl-auto: validate   # Hibernate does NOT create tables; Flyway owns the schema.
    show-sql: false

  # ---- Flyway (runs the SQL migrations at startup) ----
  flyway:
    enabled: true
    locations: classpath:db/migration

  # H2's browser console, handy for inspecting the dev database at /h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# ---- JWT settings (used from step 3d) ----
# The secret signs the login tokens. In production this comes from an env var,
# never hard-coded. This dev default is only for local use.
fintrack:
  jwt:
    secret: "dev-only-change-me-this-must-be-at-least-32-bytes-long!!"
    expiration-ms: 86400000   # 24 hours
