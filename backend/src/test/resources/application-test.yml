# Test profile configuration. Uses a fresh in-memory H2 with our real Flyway
# schema. Each test method runs in a transaction that is rolled back, so tests
# never see each other's data.
spring:
  datasource:
    url: jdbc:h2:mem:fintrack_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

fintrack:
  jwt:
    secret: "test-only-secret-key-that-is-at-least-32-bytes-long!!"
    expiration-ms: 86400000
