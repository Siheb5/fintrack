# GitHub Actions workflow: runs the backend test suite automatically.
#
# It triggers on every push and pull request that touches the backend, builds
# the project with Maven, and runs all JUnit tests against the in-memory H2
# database. A green check here means the whole backend still works.

name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code onto the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Install Java 21 and cache Maven downloads for speed.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compile and run every test. -B = non-interactive (batch) mode.
      - name: Run tests
        working-directory: backend
        run: mvn -B verify
